<div class="container-spinner" [ngClass]="styleClassContainer">
  @if (showLabel) {
    <div class="me-2">{{ message | translate }}</div>
  }
  <div
    class="progress-spinner progress-spinner-active"
    [ngClass]="styleClassSpinner"
    role="status"
    aria-live="polite"
  >
    <span class="visually-hidden">{{ message | translate }}</span>
  </div>
</div>
