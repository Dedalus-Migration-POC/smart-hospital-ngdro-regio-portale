@if (card.href) {
  <a [href]="card.href" class="card-link">
    <ng-container *ngTemplateOutlet="cardContent"></ng-container>
  </a>
} @else {
  <div>
    <ng-container *ngTemplateOutlet="cardContent"></ng-container>
  </div>
}

<ng-template #cardContent>
  @if (card.imagePos === "right") {
    <div class="d-flex flex-row gap-2">
      <div class="d-flex flex-column justify-content-start gap-2">
        <h3 class="mb-0" [ngClass]="card.styleClassTitle">
          {{ card.title }}
        </h3>
        <p class="mb-0" [ngClass]="card.styleClassDescription">
          {{ card.description }}
        </p>
      </div>
      <img [src]="card.pathImage" aria-hidden="true" alt="" />
    </div>
  } @else {
    <div
      class="d-flex flex-column gap-3 align-items-center justify-content-center"
    >
      <img
        [src]="card.pathImage"
        aria-hidden="true"
        alt=""
        [attr.width]="card.imageWith || 80"
        [attr.height]="card.imageHeight || 80"
      />
      <h3 class="mb-0 text-center" [ngClass]="card.styleClassTitle">
        {{ card.title }}
      </h3>
    </div>
  }
</ng-template>
