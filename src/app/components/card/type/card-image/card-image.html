<a [href]="card.href" class="card-link">
  <div class="d-flex flex-row gap-2">
    <div class="d-flex flex-column justify-content-start gap-2">
      <h3 class="mb-0" [ngClass]="card.styleClassTitle">{{ card.title }}</h3>
      <p class="mb-0" [ngClass]="card.styleClassDescription">
        {{ card.description }}
      </p>
    </div>
    <img [src]="card.image" aria-hidden="true" alt="" />
  </div>
</a>
