<section class="container-dashboard container-xxl d-flex flex-row">
  <div
    class="container-regional-service-available flex-grow-1 d-flex align-content-center"
    [ngClass]="{
      'justify-content-start': !bootLoading(),
      'justify-content-center': bootLoading(),
    }"
  >
    @if (bootLoading()) {
      <app-spinner [showLabel]="false"></app-spinner>
    } @else {
      @if (viewModel().listError) {
        <div
          class="alert alert-danger d-flex align-self-center"
          role="alert"
          aria-live="polite"
        >
          <span class="d-flex align-self-center mx-3">{{
            "common.error-loading" | translate
          }}</span>
          <button
            type="button"
            class="btn btn-primary btn-sm"
            (click)="reload()"
            [attr.aria-label]="'common.retry' | translate"
          >
            {{ "common.retry" | translate }}
          </button>
        </div>
      } @else {
        @if (showEmpty()) {
          <div class="d-flex align-self-center justify-self-center">
            {{ "common.empty" | translate }}
          </div>
        } @else {
          <!-- 
            [postFailed]="viewModel().postFailed"
              [failedCount]="viewModel().failedCount"
              [total]="load().total"
              (reload)="reload()" 
              -->
          <app-card
            class="flex-grow-1"
            [cardContainer]="cardActionContainer"
            [cardContent]="cards()"
            [loading]="showLoadingChip()"
            [loadingLabel]="'common.loading'"
            aria-live="polite"
          />
        }
      }
    }
  </div>

  <app-user-profile />
</section>
